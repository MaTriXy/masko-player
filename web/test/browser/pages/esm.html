<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ES module page</title>
    <style>
      body { margin: 0; background: #fff; }
      #m { width: 240px; height: 240px; }
    </style>
  </head>
  <body>
    <div id="m"></div>
    <script type="module">
      import { mountMascot } from '/dist/index.js';
      import { record, testDelivery, watch } from '/pages/harness.js';

      window.start = (options = {}) => {
        const element = document.getElementById('m');
        const common = { sound: options.sound, autoPlay: options.autoPlay };
        window.handle = mountMascot(
          element,
          options.clip ? { ...common, clip: options.clip } : { ...common, delivery: options.delivery ?? testDelivery(options) }
        );
        window.events = record(window.handle);
        window.watcher = watch(element.querySelector('.masko-player'));
        return true;
      };
      window.ready = true;
    </script>
  </body>
</html>
