# Publishes @masko/player and @masko/player-react-native to npm, masko_player
# to pub.dev and ai.masko:player to Maven Central, when a version tag (0.2.0,
# no "v") is pushed. npm and pub.dev trust this workflow directly (trusted
# publishing): there is no token and no one-time code. Each package's settings
# on npmjs.com name masko-ai/masko-player and this file, release.yml, so
# renaming it stops the npm publishing; masko_player's admin page on pub.dev
# names the repository and the tag pattern {{version}}. Maven Central has no
# trusted publishing: the Central Portal token and the signing key are
# repository secrets (android/README.md, "Publish to Maven Central").
name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read
  # Lets npm and pub.dev verify that a publish comes from this workflow.
  id-token: write

defaults:
  run:
    shell: bash

jobs:
  web:
    name: Publish @masko/player
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: The tag is the package's version
        run: test "$(node -p "require('./web/package.json').version")" = "$GITHUB_REF_NAME"
      - uses: ./.github/actions/rust
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install packages
        working-directory: web
        run: npm ci
      - name: Build the engine and the package
        run: scripts/build-web.sh --package
      - name: Typecheck and test
        working-directory: web
        run: |
          npm run typecheck
          npm test
      - name: Publish
        working-directory: web
        run: npx --yes npm@12 publish --access public

  android:
    name: Publish ai.masko:player
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: The tag is the library's version
        run: grep -qx "version = \"$GITHUB_REF_NAME\"" android/player/build.gradle.kts
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-provider: basic
      - name: Install the NDK of scripts/build-android.sh
        run: |
          # shellcheck disable=SC2016 # the pattern matches a literal ${
          ndk="$(sed -n 's/^NDK_VERSION="\${MASKO_NDK_VERSION:-\([^}]*\)}"$/\1/p' scripts/build-android.sh)"
          test -n "$ndk"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ndk" >> "$GITHUB_ENV"
      - uses: ./.github/actions/rust
      - name: Build the engine
        run: scripts/build-android.sh
      - name: Test
        working-directory: android
        run: ./gradlew :player:testDebugUnitTest :player:lintRelease
      - name: Publish
        working-directory: android
        # Uploads the signed AAR, POM, sources and javadoc jars and releases
        # them, with no step left on central.sonatype.com.
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_KEY_PASSWORD }}
        run: ./gradlew :player:publishAndReleaseToMavenCentral

  react-native:
    name: Publish @masko/player-react-native
    # The package carries the iOS engine, which only builds on a Mac, and the
    # Android engine.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: The tag is the package's version and its Android library's
        run: |
          test "$(node -p "require('./react-native/package.json').version")" = "$GITHUB_REF_NAME"
          grep -qx "version = \"$GITHUB_REF_NAME\"" android/player/build.gradle.kts
          grep -qx "version = '$GITHUB_REF_NAME'" react-native/android/build.gradle
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-provider: basic
      - name: Install the NDK of scripts/build-android.sh
        run: |
          # shellcheck disable=SC2016 # the pattern matches a literal ${
          ndk="$(sed -n 's/^NDK_VERSION="\${MASKO_NDK_VERSION:-\([^}]*\)}"$/\1/p' scripts/build-android.sh)"
          test -n "$ndk"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ndk" >> "$GITHUB_ENV"
      - uses: ./.github/actions/rust
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Build the native players
        run: |
          xcodebuild -version
          scripts/build-react-native.sh
      - name: Install packages
        working-directory: react-native
        run: npm ci
      - name: Typecheck and test
        working-directory: react-native
        run: |
          npm run typecheck
          npm test
      - name: Publish
        working-directory: react-native
        # prepack copies the Swift player, the iOS engine and ai.masko:player
        # into the package.
        run: npx --yes npm@12 publish --access public

  flutter:
    name: Publish masko_player
    # The package carries the iOS engine, which only builds on a Mac, and the
    # Android engine.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: The tag is the package's version and its Android library's
        run: |
          grep -qx "version: $GITHUB_REF_NAME" flutter/pubspec.yaml
          grep -qx "version = \"$GITHUB_REF_NAME\"" flutter/android/build.gradle.kts
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-provider: basic
      - name: Install the NDK of scripts/build-android.sh
        run: |
          # shellcheck disable=SC2016 # the pattern matches a literal ${
          ndk="$(sed -n 's/^NDK_VERSION="\${MASKO_NDK_VERSION:-\([^}]*\)}"$/\1/p' scripts/build-android.sh)"
          test -n "$ndk"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ndk" >> "$GITHUB_ENV"
      - uses: ./.github/actions/rust
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Build the native players and copy them into the package
        run: |
          xcodebuild -version
          scripts/build-flutter.sh
      - name: Install Flutter
        run: |
          curl -fsSL -o "$RUNNER_TEMP/flutter.zip" \
            https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/flutter_macos_arm64_3.47.9-stable.zip
          unzip -q "$RUNNER_TEMP/flutter.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Analyze and test
        working-directory: flutter
        run: |
          flutter pub get
          flutter analyze
          flutter test
      # Makes the GitHub token pub.dev trusts and gives it to pub (PUB_TOKEN).
      # Right before publishing: the token is short-lived.
      - uses: dart-lang/setup-dart@v1.8.1
      - name: Publish
        working-directory: flutter
        # The package publishes the native players build-flutter.sh copied in
        # (.pubignore).
        run: flutter pub publish --force
